<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 24px;
    }

    h2 {
      font-size: 1.15rem;
      color: #0f172a;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea,
    select {
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #1e293b;
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,.15);
    }

    textarea { resize: vertical; min-height: 80px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: #475569;
    }
    .checkbox-group input { width: auto; }

    .btn-row { display: flex; gap: 10px; margin-top: 6px; }

    button {
      padding: 9px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    .btn-submit { background: #38bdf8; color: #0f172a; }
    .btn-reset  { background: #e2e8f0; color: #475569; }

    #toast {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    #toast.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    #toast.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

<h2>📋 Contact Form</h2>

<form id="contactForm" novalidate>
  <div class="row">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
    </div>
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="jane@example.com" required>
  </div>

  <div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+1 555 000 1234">
  </div>

  <div class="form-group">
    <label for="subject">Subject</label>
    <select id="subject" name="subject">
      <option value="">— Select a subject —</option>
      <option value="support">Technical Support</option>
      <option value="billing">Billing</option>
      <option value="general">General Enquiry</option>
      <option value="feedback">Feedback</option>
    </select>
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Write your message here…" required></textarea>
  </div>

  <div class="form-group">
    <label class="checkbox-group">
      <input type="checkbox" id="newsletter" name="newsletter">
      Subscribe to newsletter
    </label>
  </div>

  <div class="btn-row">
    <button type="submit" class="btn-submit">Send Message</button>
    <button type="reset"  class="btn-reset">Reset</button>
  </div>

  <div id="toast"></div>
</form>

<script>
  const form  = document.getElementById('contactForm');
  const toast = document.getElementById('toast');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fn = document.getElementById('firstName').value.trim();
    const em = document.getElementById('email').value.trim();

    if (!fn || !em) {
      showToast('Please fill in all required fields.', 'error');
      return;
    }

    showToast('Message sent successfully! ✔', 'success');
    parent.postMessage({ type: 'iframeMsg', sender: 'form.html', text: `Form submitted by ${fn}` }, '*');
  });

  form.addEventListener('reset', () => {
    toast.style.display = 'none';
  });

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = type;
    toast.style.display = 'block';
  }

  // Listen for broadcast / clear from parent
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d) return;
    if (d.type === 'broadcast') {
      showToast('📡 ' + d.text, 'success');
    }
    if (d.type === 'clear') {
      form.reset();
      toast.style.display = 'none';
    }
  });
</script>

</body>
</html>
