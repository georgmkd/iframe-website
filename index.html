<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Switch Test</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f0f4f8; }

    header {
      background: #1e293b;
      color: #fff;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .nav {
      background: #334155;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .nav span { color: #94a3b8; font-size: 0.8rem; margin-right: 4px; }
    .nav a {
      background: #475569;
      color: #e2e8f0;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }
    .nav a:hover { background: #38bdf8; color: #0f172a; }
    .sep { width: 1px; height: 20px; background: #475569; }

    .frames {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px 20px;
    }

    .panel {
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
    }
    .panel.wide { grid-column: 1 / -1; }

    .panel-title {
      background: #e2e8f0;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: bold;
      color: #334155;
      border-bottom: 1px solid #cbd5e1;
    }

    iframe {
      display: block;
      width: 100%;
      height: 300px;
      border: none;
    }
    .panel.wide iframe { height: 230px; }

    #statusBar {
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 6px 20px;
      border-top: 1px solid #334155;
    }
    #statusBar span { color: #38bdf8; }
  </style>
</head>
<body>

<header>🖥️ Iframe Switch Test &mdash; Usetrace</header>

<!-- Navigation links targeting specific iframes -->
<div class="nav">
  <span>Frame 1 →</span>
  <a onclick="loadPage('f1', 'form')">Form</a>
  <a onclick="loadPage('f1', 'login')">Login</a>
  <a onclick="loadPage('f1', 'search')">Search</a>

  <div class="sep"></div>

  <span>Frame 2 →</span>
  <a onclick="loadPage('f2', 'login')">Login</a>
  <a onclick="loadPage('f2', 'form')">Form</a>
  <a onclick="loadPage('f2', 'search')">Search</a>

  <div class="sep"></div>

  <span>Frame 3 →</span>
  <a onclick="loadPage('f3', 'search')">Search</a>
  <a onclick="loadPage('f3', 'form')">Form</a>
  <a onclick="loadPage('f3', 'login')">Login</a>

  <div class="sep"></div>

  <span>Frame 4 →</span>
  <a onclick="loadPage('f4', 'form')">Form</a>
  <a onclick="loadPage('f4', 'login')">Login</a>
  <a onclick="loadPage('f4', 'search')">Search</a>
</div>

<!-- Iframes grid -->
<div class="frames">

  <div class="panel">
    <div class="panel-title">Frame 1</div>
    <iframe id="f1" name="f1" title="Frame 1"></iframe>
  </div>

  <div class="panel">
    <div class="panel-title">Frame 2</div>
    <iframe id="f2" name="f2" title="Frame 2"></iframe>
  </div>

  <div class="panel">
    <div class="panel-title">Frame 3</div>
    <iframe id="f3" name="f3" title="Frame 3"></iframe>
  </div>

  <div class="panel wide">
    <div class="panel-title">Frame 4 (wide)</div>
    <iframe id="f4" name="f4" title="Frame 4"></iframe>
  </div>

</div>

<div id="statusBar">Last action: <span id="statusText">—</span></div>

  var data=[

  };

  /* ── Load a page template into an iframe ── */
  function loadPage(frameId, pageName) {
    var iframe = document.getElementById(frameId);
    iframe.srcdoc = PAGES[pageName];
    document.getElementById('statusText').textContent =
      'Loaded "' + pageName + '" into ' + frameId + ' at ' + new Date().toLocaleTimeString();
  }

  /* ── Boot: set initial content for each frame ── */
  window.addEventListener('DOMContentLoaded', function () {
    document.getElementById('f1').srcdoc = PAGES.form;
    document.getElementById('f2').srcdoc = PAGES.login;
    document.getElementById('f3').srcdoc = PAGES.search;
    document.getElementById('f4').srcdoc = PAGES.form;
  });

  /* ── Receive messages from iframes — no alerts ── */
  window.addEventListener('message', function (event) {
    var d = event.data;
    if (d && d.type === 'iframeMsg') {
      document.getElementById('statusText').textContent =
        '[' + d.sender + '] ' + d.text + ' — ' + new Date().toLocaleTimeString();
    }
  });
</script>

</body>
