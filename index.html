<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi Iframe Interactive App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f4f4;
    }

    header {
      background: #222;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .controls {
      padding: 10px;
      background: #ddd;
      display: flex;
      gap: 10px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>

<header>Interactive Iframe Dashboard</header>

<div class="controls">
  <input type="text" id="globalInput" placeholder="Send message to iframes">
  <button onclick="sendToIframes()">Send</button>
</div>

<div class="container">
  <iframe src="frame1.html" id="frame1"></iframe>
  <iframe src="frame2.html" id="frame2"></iframe>
</div>

<script>
  function sendToIframes() {
    const message = document.getElementById('globalInput').value;

    document.getElementById('frame1').contentWindow.postMessage(message, '*');
    document.getElementById('frame2').contentWindow.postMessage(message, '*');
  }

  // Listen from iframes
  window.addEventListener('message', (event) => {
    console.log("Message from iframe:", event.data);
    alert("Iframe says: " + event.data);
  });
</script>

</body>
</html>
