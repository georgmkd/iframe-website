<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 28px 24px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }

    h2 {
      font-size: 1.1rem;
      color: #0f172a;
      margin-bottom: 20px;
      text-align: center;
    }

    .avatar {
      width: 56px; height: 56px;
      background: #e0f2fe;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 18px;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #1e293b;
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,.15);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 16px;
    }
    .remember-row label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; text-transform: none; letter-spacing: 0; }
    .remember-row a { color: #38bdf8; text-decoration: none; }
    .remember-row a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-login:hover { background: #1e3a5f; }

    .divider {
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
      margin: 14px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%; width: calc(50% - 24px);
      height: 1px; background: #e2e8f0;
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .btn-google {
      width: 100%;
      padding: 9px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s;
    }
    .btn-google:hover { background: #f9fafb; }

    .signup-row {
      text-align: center;
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 16px;
    }
    .signup-row a { color: #38bdf8; text-decoration: none; }
    .signup-row a:hover { text-decoration: underline; }

    #toast {
      display: none;
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
    }
    #toast.success { background: #dcfce7; color: #166534; }
    #toast.error   { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="card">
  <div class="avatar">🔐</div>
  <h2>Sign In</h2>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required autocomplete="email">
    </div>

    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <div class="remember-row">
      <label>
        <input type="checkbox" id="rememberMe" name="rememberMe">
        Remember me
      </label>
      <a href="#" onclick="return false">Forgot password?</a>
    </div>

    <button type="submit" class="btn-login">Sign In</button>
    <div id="toast"></div>
  </form>

  <div class="divider">or</div>

  <button class="btn-google" onclick="return false">
    <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.5 2.3 30.1 0 24 0 14.7 0 6.7 5.4 2.9 13.3l7.9 6.1C12.6 13.3 17.9 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.5 2.9-2.2 5.4-4.7 7l7.3 5.7c4.3-4 6.9-9.8 6.9-16.7z" style="fill:#4285F4"/><path fill="#FBBC05" d="M10.8 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.1.7-4.6L2.3 13.3A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.3-6.2z"/><path fill="#34A853" d="M24 48c6.1 0 11.2-2 14.9-5.4l-7.3-5.7c-2 1.4-4.6 2.1-7.6 2.1-6.1 0-11.3-4.1-13.2-9.6l-8.3 6.2C6.7 42.6 14.7 48 24 48z"/></svg>
    Continue with Google
  </button>

  <div class="signup-row">
    Don't have an account? <a href="#" onclick="return false">Sign up</a>
  </div>
</div>

<script>
  const form  = document.getElementById('loginForm');
  const toast = document.getElementById('toast');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const em = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;

    if (!em || !pw) {
      showToast('Email and password are required.', 'error');
      return;
    }

    showToast('Signed in successfully ✔', 'success');
    parent.postMessage({ type: 'iframeMsg', sender: 'login.html', text: `Login attempt for ${em}` }, '*');
  });

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className   = type;
    toast.style.display = 'block';
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d) return;
    if (d.type === 'broadcast') showToast('📡 ' + d.text, 'success');
    if (d.type === 'clear') { form.reset(); toast.style.display = 'none'; }
  });
</script>

</body>
</html>
